name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c requirements/constraints.txt -e '.[test]'
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: python -m pytest --cov=buildingmind --cov-report=term-missing

  optional-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements/constraints.txt -e '.[test,openai]'
      - run: python -m pytest
